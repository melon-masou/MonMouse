[package]
name = "monmouse"
version.workspace = true
edition = "2021"
license = "MIT"
authors = ["melon.masou <melon.masou@outlook.com>"]
default-run = "monmouse"
build = "build.rs"

[workspace]
members = ["crates/monmouse-macros", "crates/monmouse-lib"]

[workspace.package]
version = "0.2.1"

[[bin]]
name = "monmouse-cli"
path = "src/cli/main.rs"

[[bin]]
name = "monmouse"
path = "src/gui/main.rs"

[dependencies]
monmouse-lib = { path = "crates/monmouse-lib" }
monmouse-macros = { path = "crates/monmouse-macros" }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.4.11", features = ["derive"] }
eframe = { version = "0.33.2", features = ["persistence", "wgpu"] }
egui_extras = { version = "0.33.2", features = [], default-features = false }
serde = { version = "1.0.193", features = ["derive"] }
validator = { version = "0.21", default-features = false, features = ["derive"] }
tray-icon = { version = "0.26.1", default-features = false }
image = "0.24.7"
serde_yaml = { package = "yaml_serde", version = "0.10" }
keyboard-types = "0.7.0"
rust-i18n = "4"
fontdb = "0.23.0"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8.9"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_HiDpi",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
]

[target.'cfg(target_os = "windows")'.build-dependencies]
which = "5.0.0"

[profile.release]
strip = true
